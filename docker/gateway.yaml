server:
  port: 3000
  host: 0.0.0.0

redis:
  url: redis://redis-cache:6379 # O 'redis://localhost:6379' si corres el proceso nativo en tu máquina
  onFailure: open

logging:
  level: info

metrics:
  enabled: true
  path: /metrics
  defaultLabels:
    environment: development

# Endpoint agregado de Health Aggregation (consulta cada target/<backendPath> en paralelo).
health:
  enabled: true
  path: /health
  backendPath: /health
  timeoutMs: 2000

# Configuración global de CORS para interceptar preflight (OPTIONS)
cors:
  enabled: true
  origins:
    - "http://localhost:8080"
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowedHeaders:
    - Content-Type
    - Authorization
  maxAge: 86400

routes:
  # ===============================================================
  # Ruta Pública (Redirige al Backend Mock)
  # ===============================================================
  - prefix: /public
    target: http://mock-service:8080
    stripPrefix: true
    # metricsLabel no definido para probar fallback a prefix
    # backendName no definido para probar fallback a hostname del target ("mock-service")

  # ===============================================================
  # Ruta Protegida con JWT (Redirige al Backend Mock)
  # ===============================================================
  - prefix: /secure
    target: http://mock-service:8080
    stripPrefix: true
    jwt:
      enabled: true
      secret: "secreto-para-pruebas-locales-de-32-chars!!!"
      algorithm: HS256
      forwardClaims:
        - sub
        - role
        - email

  # ===============================================================
  # Ruta mapeada a la PokéAPI Real
  # ===============================================================
  - prefix: /api/v2
    target: https://pokeapi.co
    stripPrefix: false
    metricsLabel: "pokeapi"
    backendName: "pokeapi-ext"
    rateLimit:
      maxRequests: 8
      windowSeconds: 60

  # ===============================================================
  # Ruta de administración (Redirige al Backend Mock)
  # ===============================================================
  - prefix: /admin
    target: http://mock-service:8080
    stripPrefix: true
    rateLimit:
      maxRequests: 100
      windowSeconds: 60

  # ===============================================================
  # Ruta de Pruebas Públicas con httpbin.org (Protegida con JWT)
  # ===============================================================
  - prefix: /httpbin
    target: https://httpbin.org
    stripPrefix: true
    jwt:
      enabled: true
      secret: "secreto-para-pruebas-locales-de-32-chars!!!"
      algorithm: HS256
      forwardClaims:
        - sub
        - role
        - email
